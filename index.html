<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel ESP32</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12151A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Panel ESP32">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12151A;
    --panel: #1A1E24;
    --panel-raised: #20252C;
    --edge: #2A3038;
    --text: #E9E6DF;
    --text-dim: #767C87;
    --brass: #C6A15B;
    --brass-bright: #DCB876;
    --amber: #E3A857;
    --amber-dim: #4A3D26;
    --off: #383D46;
    --danger: #C4644F;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Space Grotesk', sans-serif;
    background: radial-gradient(circle at 15% 0%, #171b21 0%, var(--bg) 45%), var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 18px 48px;
    margin: 0;
    min-height: 100vh;
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  h1 { font-size: 1.4rem; font-weight: 700; margin: 2px 0 18px; letter-spacing: -0.01em; }

  .tabs {
    display: flex;
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 20px;
    gap: 4px;
  }
  .tab-btn {
    flex: 1;
    padding: 11px 4px;
    text-align: center;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 500;
    border-radius: 7px;
    cursor: pointer;
  }
  .tab-btn.active { background: var(--panel-raised); color: var(--brass-bright); box-shadow: inset 0 0 0 1px var(--edge); }
  .tab-content { display: none; width: 100%; max-width: 420px; }
  .tab-content.active { display: flex; flex-direction: column; align-items: center; }

  .estado-badge {
    display: flex; align-items: center; gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase;
    padding: 9px 14px; border-radius: 8px; width: 100%;
    margin-bottom: 18px; background: var(--panel); border: 1px solid var(--edge); color: var(--text-dim);
  }
  .led-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); flex-shrink: 0; }
  .estado-badge.conectado { color: var(--amber); }
  .estado-badge.conectado .led-dot { background: var(--amber); box-shadow: 0 0 6px 1px var(--amber); }

  .empty-msg {
    color: var(--text-dim);
    font-size: 0.85rem;
    text-align: center;
    padding: 30px 10px;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* Fila genérica de accionador */
  .device-row {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; background: var(--panel); border: 1px solid var(--edge);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 10px;
    -webkit-tap-highlight-color: transparent;
  }
  .device-info { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
  .device-name { font-size: 0.95rem; font-weight: 600; }
  .device-topic { font-family: 'IBM Plex Mono', monospace; font-size: 0.64rem; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .device-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  .del-btn {
    width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--edge);
    background: var(--panel-raised); color: var(--danger); font-size: 0.9rem;
    display: none; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  body.modo-edicion .del-btn { display: flex; }

  /* Rocker */
  .rocker { width: 50px; height: 28px; border-radius: 6px; background: linear-gradient(180deg, #23282f, #1a1e24); border: 1px solid var(--edge); position: relative; flex-shrink: 0; box-shadow: inset 0 1px 2px rgba(0,0,0,0.5); cursor: pointer; }
  .rocker::after { content: ''; position: absolute; top: 3px; bottom: 3px; left: 3px; width: 20px; border-radius: 4px; background: linear-gradient(180deg, #4a5058, #2c3138); box-shadow: 0 1px 2px rgba(0,0,0,0.6); transition: left 0.18s ease, background 0.18s ease; }
  .rocker.on { border-color: var(--brass); }
  .rocker.on::after { left: 25px; background: linear-gradient(180deg, var(--brass-bright), var(--brass)); box-shadow: 0 0 8px rgba(198,161,91,0.35); }

  /* LED indicador de solo lectura */
  .led-indicador { width: 16px; height: 16px; border-radius: 50%; background: var(--off); border: 1px solid var(--edge); flex-shrink: 0; }
  .led-indicador.on { background: var(--amber); box-shadow: 0 0 10px 2px rgba(227,168,87,0.5); border-color: var(--amber); }

  /* Slider */
  .slider-box { background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 14px 16px 16px; margin-bottom: 10px; width: 100%; position: relative; }
  .slider-box .top-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .slider-box .device-name { font-size: 0.85rem; }
  .slider-box .val { font-family: 'IBM Plex Mono', monospace; color: var(--brass-bright); font-weight: 500; font-size: 0.8rem; }
  input[type="range"] { -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--brass) var(--fill, 50%), var(--off) var(--fill, 50%)); outline: none; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(180deg, var(--brass-bright), var(--brass)); border: 1px solid #8a7440; cursor: pointer; }
  input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(180deg, var(--brass-bright), var(--brass)); border: 1px solid #8a7440; cursor: pointer; }
  .mini-log { margin-top: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 0.66rem; color: var(--text-dim); display: flex; flex-direction: column; gap: 2px; }
  .mini-log .mini-log-row:first-child { color: var(--brass-bright); }

  /* Texto */
  .texto-box { background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; width: 100%; }
  .texto-box .top-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .texto-row { display: flex; gap: 8px; }
  .texto-row input[type="text"] { flex: 1; padding: 9px 10px; border-radius: 7px; border: 1px solid var(--edge); background: #0D0F13; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 0.82rem; }
  .send-btn { padding: 9px 14px; border-radius: 7px; border: 1px solid var(--brass); background: linear-gradient(180deg, var(--brass-bright), var(--brass)); color: #1a1508; font-weight: 700; font-size: 0.8rem; cursor: pointer; }

  /* Voz */
  .voz-box { background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; width: 100%; }
  .voz-row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .mic-btn { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--brass); background: linear-gradient(180deg, var(--brass-bright), var(--brass)); color: #1a1508; font-size: 1.1rem; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .mic-btn.escuchando { background: var(--danger); border-color: var(--danger); color: #2a0f0a; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(196,100,79,0.5);} 50% { box-shadow: 0 0 0 8px rgba(196,100,79,0);} }
  .transcripcion { font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; color: var(--text-dim); flex: 1; }

  #log { margin-top: 14px; width: 100%; background: #0D0F13; border: 1px solid var(--edge); border-radius: 8px; padding: 12px 14px; font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; line-height: 1.5; color: #8FDBA8; min-height: 44px; white-space: pre-wrap; }
  #log::before { content: '> '; color: var(--text-dim); }

  .panel { width: 100%; background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 18px 16px; margin-bottom: 14px; }
  .panel-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin: 12px 0 4px; }
  .panel-label:first-child { margin-top: 0; }
  .panel input[type="text"], .panel input[type="password"], .panel input[type="number"], .panel select {
    width: 100%; padding: 11px 12px; border-radius: 7px; border: 1px solid var(--edge);
    background: #0D0F13; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem;
  }
  .panel input:focus, .panel select:focus { outline: 1px solid var(--brass); border-color: var(--brass); }
  .check-row { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--text-dim); margin-top: 14px; }
  .check-row input { width: auto; accent-color: var(--brass); }
  .panel button.primary { width: 100%; margin-top: 16px; padding: 13px; border: 1px solid var(--brass); border-radius: 8px; background: linear-gradient(180deg, var(--brass-bright), var(--brass)); color: #1a1508; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
  #estado { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; margin-top: 12px; text-align: center; }
  #estado.conectado { color: var(--amber); }
  #estado.desconectado { color: var(--danger); }

  .row-2col { display: flex; gap: 10px; }
  .row-2col > div { flex: 1; }

  .edit-toggle {
    width: 100%; max-width: 420px; display: flex; justify-content: flex-end; margin-bottom: 8px;
  }
  .edit-toggle button {
    background: var(--panel); border: 1px solid var(--edge); color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; text-transform: uppercase;
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
  }
  body.modo-edicion .edit-toggle button { color: var(--danger); border-color: var(--danger); }
</style>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
  <div class="eyebrow">Sistema domótico</div>
  <h1>Panel ESP32</h1>

  <div class="tabs">
    <button class="tab-btn active" id="tabBtnControl" onclick="mostrarTab('control')">Control</button>
    <button class="tab-btn" id="tabBtnAgregar" onclick="mostrarTab('agregar')">Agregar</button>
    <button class="tab-btn" id="tabBtnHistorial" onclick="mostrarTab('historial')">Historial</button>
    <button class="tab-btn" id="tabBtnConexion" onclick="mostrarTab('conexion')">Conexión</button>
  </div>

  <!-- PESTAÑA CONTROL -->
  <div class="tab-content active" id="tabControl">
    <div class="estado-badge desconectado" id="estadoBadge">
      <span class="led-dot" id="estadoLed"></span>
      <span id="estadoTexto">Desconectado</span>
    </div>

    <div class="edit-toggle">
      <button onclick="toggleModoEdicion()" id="btnEditar">Editar</button>
    </div>

    <div id="listaAccionadores"></div>

    <div id="log">Esperando comando...</div>
  </div>

  <!-- PESTAÑA AGREGAR -->
  <div class="tab-content" id="tabAgregar">
    <div class="panel">
      <div class="panel-label">Nombre</div>
      <input type="text" id="nuevoNombre" placeholder="Ej: Luz del pasillo">

      <div class="panel-label">Tipo de accionador</div>
      <select id="nuevoTipo" onchange="actualizarCamposFormulario()">
        <option value="interruptor">Interruptor (ON/OFF)</option>
        <option value="slider">Slider (valor 0-100)</option>
        <option value="led">LED indicador (solo lectura)</option>
        <option value="texto">Entrada de texto</option>
        <option value="voz">Entrada de voz</option>
      </select>

      <div class="panel-label">Tópico de comando</div>
      <input type="text" id="nuevoTopicCmd" placeholder="casa/pasillo/luz">

      <div id="campoEstado">
        <div class="panel-label">Tópico de estado (opcional)</div>
        <input type="text" id="nuevoTopicEstado" placeholder="casa/pasillo/luz/estado">
      </div>

      <div id="campoMinMax" style="display:none;">
        <div class="row-2col">
          <div>
            <div class="panel-label">Mínimo</div>
            <input type="number" id="nuevoMin" value="0">
          </div>
          <div>
            <div class="panel-label">Máximo</div>
            <input type="number" id="nuevoMax" value="100">
          </div>
        </div>
      </div>

      <button class="primary" onclick="agregarAccionador()">Agregar accionador</button>
    </div>
  </div>

  <!-- PESTAÑA HISTORIAL -->
  <div class="tab-content" id="tabHistorial">
    <div class="panel">
      <div class="panel-label">Accionador</div>
      <select id="historialSelect" onchange="renderHistorialSeleccionado()">
        <option value="">Seleccioná uno...</option>
      </select>
    </div>
    <div id="historialLista"></div>
  </div>

  <!-- PESTAÑA CONEXION -->
  <div class="tab-content" id="tabConexion">
    <div class="panel">
      <div class="panel-label">Host del broker</div>
      <input id="mqttHost" type="text" placeholder="xxxxxxxx.s1.eu.hivemq.cloud">
      <div class="panel-label">Usuario</div>
      <input id="mqttUser" type="text" placeholder="Usuario">
      <div class="panel-label">Contraseña</div>
      <input id="mqttPass" type="password" placeholder="Contraseña">
      <label class="check-row">
        <input type="checkbox" id="recordarPass"> Recordar y conectar automático
      </label>
      <button class="primary" onclick="conectarMQTT()">Conectar</button>
      <div id="estado" class="desconectado">Desconectado</div>
    </div>
  </div>

<script>
  let client = null;
  let modoEdicion = false;
  let recognitionActivo = null;

  // ================= Historial global (persistente) =================
  function cargarHistorial() {
    const raw = localStorage.getItem('historialGlobal');
    if (raw) { try { return JSON.parse(raw); } catch { /* ignore */ } }
    return {};
  }
  let historialGlobal = cargarHistorial();

  function registrarHistorial(accionadorId, valor) {
    const hora = new Date().toLocaleString('es-AR', {
      day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
    if (!historialGlobal[accionadorId]) historialGlobal[accionadorId] = [];
    historialGlobal[accionadorId].unshift({ hora, valor });
    historialGlobal[accionadorId] = historialGlobal[accionadorId].slice(0, 20); // últimos 20 por accionador
    localStorage.setItem('historialGlobal', JSON.stringify(historialGlobal));
  }

  function poblarSelectHistorial() {
    const select = document.getElementById('historialSelect');
    const actual = select.value;
    select.innerHTML = '<option value="">Seleccioná uno...</option>' +
      accionadores.map(a => `<option value="${a.id}">${a.nombre}</option>`).join('');
    if (actual && accionadores.some(a => a.id === actual)) select.value = actual;
    renderHistorialSeleccionado();
  }

  function renderHistorialSeleccionado() {
    const id = document.getElementById('historialSelect').value;
    const cont = document.getElementById('historialLista');
    if (!id) {
      cont.innerHTML = '<div class="empty-msg">Elegí un accionador para ver su historial.</div>';
      return;
    }
    const registros = historialGlobal[id] || [];
    if (registros.length === 0) {
      cont.innerHTML = '<div class="empty-msg">Todavía no hay estados registrados para este accionador.</div>';
      return;
    }
    cont.innerHTML = `<div class="panel">` + registros.map(r =>
      `<div class="mini-log-row" style="font-family:'IBM Plex Mono',monospace; font-size:0.8rem; padding:6px 0; border-bottom:1px solid var(--edge); display:flex; justify-content:space-between;">
         <span style="color:var(--text-dim);">${r.hora}</span><span style="color:var(--brass-bright);">${r.valor}</span>
       </div>`
    ).join('') + `</div>`;
  }

  // ================= Tabs =================
  function mostrarTab(nombre) {
    ['control','agregar','historial','conexion'].forEach(t => {
      document.getElementById('tab' + t[0].toUpperCase() + t.slice(1)).classList.toggle('active', t === nombre);
      document.getElementById('tabBtn' + t[0].toUpperCase() + t.slice(1)).classList.toggle('active', t === nombre);
    });
    if (nombre === 'historial') poblarSelectHistorial();
  }

  function toggleModoEdicion() {
    modoEdicion = !modoEdicion;
    document.body.classList.toggle('modo-edicion', modoEdicion);
    document.getElementById('btnEditar').textContent = modoEdicion ? 'Listo' : 'Editar';
  }

  // ================= Modelo de accionadores =================
  function cargarAccionadores() {
    const raw = localStorage.getItem('accionadores');
    if (raw) {
      try { return JSON.parse(raw); } catch { /* ignore */ }
    }
    // Set inicial de ejemplo
    return [
      { id: 'a1', nombre: 'Cocina', tipo: 'interruptor', topicCmd: 'casa/cocina/luz', topicEstado: 'casa/cocina/luz/estado' },
      { id: 'a2', nombre: 'Taller', tipo: 'interruptor', topicCmd: 'casa/taller/luz', topicEstado: 'casa/taller/luz/estado' },
      { id: 'a3', nombre: 'Brillo cocina', tipo: 'slider', topicCmd: 'casa/cocina/brillo', topicEstado: 'casa/cocina/brillo/estado', min: 0, max: 100 },
    ];
  }

  let accionadores = cargarAccionadores();

  function guardarAccionadores() {
    localStorage.setItem('accionadores', JSON.stringify(accionadores));
  }

  function actualizarCamposFormulario() {
    const tipo = document.getElementById('nuevoTipo').value;
    document.getElementById('campoMinMax').style.display = tipo === 'slider' ? 'block' : 'none';
    document.getElementById('campoEstado').style.display = tipo === 'voz' ? 'none' : 'block';
  }

  function agregarAccionador() {
    const nombre = document.getElementById('nuevoNombre').value.trim();
    const tipo = document.getElementById('nuevoTipo').value;
    const topicCmd = document.getElementById('nuevoTopicCmd').value.trim();
    const topicEstado = document.getElementById('nuevoTopicEstado').value.trim();
    const min = parseInt(document.getElementById('nuevoMin').value, 10) || 0;
    const max = parseInt(document.getElementById('nuevoMax').value, 10) || 100;

    if (!nombre || !topicCmd) {
      alert('Completá al menos el nombre y el tópico de comando.');
      return;
    }
    if (tipo === 'led' && !topicEstado) {
      alert('Un LED indicador necesita un tópico de estado para saber qué mostrar.');
      return;
    }

    const nuevo = { id: 'a' + Date.now(), nombre, tipo, topicCmd, topicEstado: topicEstado || null };
    if (tipo === 'slider') { nuevo.min = min; nuevo.max = max; }

    accionadores.push(nuevo);
    guardarAccionadores();
    renderAccionadores();
    suscribirEstados();

    document.getElementById('nuevoNombre').value = '';
    document.getElementById('nuevoTopicCmd').value = '';
    document.getElementById('nuevoTopicEstado').value = '';
    mostrarTab('control');
  }

  function eliminarAccionador(id) {
    if (!confirm('¿Eliminar este accionador?')) return;
    accionadores = accionadores.filter(a => a.id !== id);
    guardarAccionadores();
    delete historialGlobal[id];
    localStorage.setItem('historialGlobal', JSON.stringify(historialGlobal));
    renderAccionadores();
  }

  // ================= Render =================
  function renderAccionadores() {
    const cont = document.getElementById('listaAccionadores');
    if (accionadores.length === 0) {
      cont.innerHTML = '<div class="empty-msg">No hay accionadores todavía.<br>Agregá uno desde la pestaña "Agregar".</div>';
      return;
    }
    cont.innerHTML = accionadores.map(renderWidget).join('');
  }

  function renderWidget(a) {
    const delBtn = `<button class="del-btn" onclick="eliminarAccionador('${a.id}')">×</button>`;
    if (a.tipo === 'interruptor') {
      return `
        <div class="device-row">
          <div class="device-info">
            <span class="device-name">${a.nombre}</span>
            <span class="device-topic">${a.topicCmd}</span>
          </div>
          <div class="device-right">
            <div class="rocker" id="rocker-${a.id}" onclick="toggleInterruptor('${a.id}')"></div>
            ${delBtn}
          </div>
        </div>`;
    }
    if (a.tipo === 'led') {
      return `
        <div class="device-row">
          <div class="device-info">
            <span class="device-name">${a.nombre}</span>
            <span class="device-topic">${a.topicEstado}</span>
          </div>
          <div class="device-right">
            <div class="led-indicador" id="led-${a.id}"></div>
            ${delBtn}
          </div>
        </div>`;
    }
    if (a.tipo === 'slider') {
      return `
        <div class="slider-box">
          <div class="top-row">
            <span class="device-name">${a.nombre}</span>
            <span class="val" id="val-${a.id}">--</span>
          </div>
          <input type="range" min="${a.min}" max="${a.max}" value="${Math.round((a.min+a.max)/2)}" id="slider-${a.id}"
                 oninput="actualizarFillLocal(this); document.getElementById('val-${a.id}').textContent = this.value"
                 onchange="publicar('${a.topicCmd}', this.value)">
          <div class="mini-log" id="hist-${a.id}">${(historialGlobal[a.id] || []).slice(0, 5).map(h => `<div class="mini-log-row">${(h.hora.split(' ').pop()) || h.hora} → ${h.valor}</div>`).join('')}</div>
          ${delBtn}
        </div>`;
    }
    if (a.tipo === 'texto') {
      return `
        <div class="texto-box">
          <div class="top-row">
            <span class="device-name">${a.nombre}</span>
            ${delBtn}
          </div>
          <div class="texto-row">
            <input type="text" id="texto-${a.id}" placeholder="Escribí un comando...">
            <button class="send-btn" onclick="enviarTexto('${a.id}', '${a.topicCmd}')">Enviar</button>
          </div>
        </div>`;
    }
    if (a.tipo === 'voz') {
      return `
        <div class="voz-box">
          <div class="top-row">
            <span class="device-name">${a.nombre}</span>
            ${delBtn}
          </div>
          <div class="voz-row">
            <button class="mic-btn" id="mic-${a.id}" onclick="toggleVoz('${a.id}', '${a.topicCmd}')">🎙</button>
            <span class="transcripcion" id="trans-${a.id}">Tocá para hablar...</span>
          </div>
        </div>`;
    }
    return '';
  }

  function actualizarFillLocal(input) {
    const pct = ((input.value - input.min) / (input.max - input.min)) * 100;
    input.style.setProperty('--fill', pct + '%');
  }

  // ================= Interacciones =================
  function toggleInterruptor(id) {
    const a = accionadores.find(x => x.id === id);
    const rocker = document.getElementById('rocker-' + id);
    const nuevoEncendido = !rocker.classList.contains('on');
    publicar(a.topicCmd, nuevoEncendido ? 'ON' : 'OFF');
    rocker.classList.toggle('on', nuevoEncendido);
  }

  function enviarTexto(id, topic) {
    const input = document.getElementById('texto-' + id);
    const valor = input.value.trim();
    if (!valor) return;
    publicar(topic, valor);
    input.value = '';
  }

  function toggleVoz(id, topic) {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const micBtn = document.getElementById('mic-' + id);
    const transEl = document.getElementById('trans-' + id);

    if (!SpeechRec) {
      transEl.textContent = 'No soportado (usá Chrome con HTTPS)';
      return;
    }

    if (recognitionActivo) {
      recognitionActivo.stop();
      return;
    }

    const rec = new SpeechRec();
    rec.lang = 'es-AR';
    rec.interimResults = false;
    rec.maxAlternatives = 1;

    rec.onstart = () => {
      recognitionActivo = rec;
      micBtn.classList.add('escuchando');
      transEl.textContent = 'Escuchando...';
    };
    rec.onresult = (e) => {
      const texto = e.results[0][0].transcript;
      transEl.textContent = '"' + texto + '"';
      publicar(topic, texto);
    };
    rec.onerror = (e) => {
      transEl.textContent = 'Error: ' + e.error;
    };
    rec.onend = () => {
      recognitionActivo = null;
      micBtn.classList.remove('escuchando');
    };
    rec.start();
  }

  // ================= Estado (mensajes entrantes) =================
  function manejarMensajeEstado(topic, valor) {
    const a = accionadores.find(x => x.topicEstado === topic);
    if (!a) return;

    if (a.tipo === 'interruptor') {
      const encendido = valor === 'ON' || valor === '1' || valor === 'true';
      document.getElementById('rocker-' + a.id)?.classList.toggle('on', encendido);
    } else if (a.tipo === 'led') {
      const encendido = valor === 'ON' || valor === '1' || valor === 'true';
      document.getElementById('led-' + a.id)?.classList.toggle('on', encendido);
    } else if (a.tipo === 'slider') {
      const num = parseInt(valor, 10);
      if (isNaN(num)) return;
      const slider = document.getElementById('slider-' + a.id);
      if (slider) { slider.value = num; actualizarFillLocal(slider); }
      const valEl = document.getElementById('val-' + a.id);
      if (valEl) valEl.textContent = num;

      const histEl = document.getElementById('hist-' + a.id);
      if (histEl) {
        const ultimos5 = (historialGlobal[a.id] || []).slice(0, 5);
        histEl.innerHTML = ultimos5.map(h => `<div class="mini-log-row">${h.hora.split(' ').pop() || h.hora} → ${h.valor}</div>`).join('');
      }
    } else if (a.tipo === 'texto') {
      const el = document.getElementById('texto-' + a.id);
      if (el) el.placeholder = 'Último: ' + valor;
    }

    registrarHistorial(a.id, valor);
    // Si la pestaña de historial está abierta y muestra este accionador, refrescarla
    if (document.getElementById('historialSelect').value === a.id) renderHistorialSeleccionado();
  }

  function suscribirEstados() {
    if (!client || !client.connected) return;
    accionadores.forEach(a => {
      if (a.topicEstado) client.subscribe(a.topicEstado);
    });
  }

  // ================= Conexión MQTT =================
  const hostInput = document.getElementById('mqttHost');
  const userInput = document.getElementById('mqttUser');
  const passInput = document.getElementById('mqttPass');
  const recordarCheck = document.getElementById('recordarPass');

  hostInput.value = localStorage.getItem('mqttHost') || '';
  userInput.value = localStorage.getItem('mqttUser') || '';
  const passGuardada = localStorage.getItem('mqttPass');
  if (passGuardada) { passInput.value = passGuardada; recordarCheck.checked = true; }

  function setEstadoUI(conectado, texto) {
    document.getElementById('estado').textContent = texto;
    document.getElementById('estado').className = conectado ? 'conectado' : 'desconectado';
    document.getElementById('estadoTexto').textContent = texto;
    document.getElementById('estadoBadge').className = 'estado-badge ' + (conectado ? 'conectado' : 'desconectado');
  }

  function conectarMQTT() {
    const host = hostInput.value.trim().replace(/^https?:\/\//, '').replace(/\/$/, '');
    const user = userInput.value.trim();
    const pass = passInput.value;
    const log = document.getElementById('log');

    if (typeof mqtt === 'undefined') {
      setEstadoUI(false, 'No cargó la librería mqtt.js');
      log.textContent = 'Revisá tu conexión a internet o si el navegador bloqueó unpkg.com';
      return;
    }
    if (!host || !user || !pass) {
      log.textContent = 'Completá host, usuario y contraseña de HiveMQ.';
      return;
    }

    localStorage.setItem('mqttHost', host);
    localStorage.setItem('mqttUser', user);
    if (recordarCheck.checked) localStorage.setItem('mqttPass', pass);
    else localStorage.removeItem('mqttPass');

    const url = `wss://${host}:8884/mqtt`;
    if (client) client.end(true);

    setEstadoUI(false, 'Conectando...');
    log.textContent = 'Probando: ' + url;

    client = mqtt.connect(url, {
      username: user, password: pass,
      clientId: 'webapp_' + Math.random().toString(16).slice(2, 8),
      clean: true, connectTimeout: 8000, reconnectPeriod: 3000
    });

    const timeoutId = setTimeout(() => {
      if (!client.connected) {
        setEstadoUI(false, 'Timeout: no respondió');
        log.textContent = '8s sin respuesta. Revisá si el cluster de HiveMQ está "Running".';
        client.end(true);
      }
    }, 8000);

    client.on('connect', () => {
      clearTimeout(timeoutId);
      setEstadoUI(true, 'Conectado');
      log.textContent = 'Listo. Suscribiendo a estados...';
      suscribirEstados();
    });

    client.on('message', (topic, message) => {
      const valor = message.toString();
      manejarMensajeEstado(topic, valor);
      document.getElementById('log').textContent = `${topic} -> ${valor}`;
    });

    client.on('error', (err) => {
      clearTimeout(timeoutId);
      setEstadoUI(false, 'Error de conexión');
      log.textContent = 'Error: ' + err.message;
    });

    client.on('close', () => setEstadoUI(false, 'Desconectado'));
  }

  function publicar(topic, payload) {
    const log = document.getElementById('log');
    if (!client || !client.connected) {
      log.textContent = 'No estás conectado. Andá a la pestaña Conexión.';
      return;
    }
    const mensaje = typeof payload === 'string' ? payload : JSON.stringify(payload);
    client.publish(topic, mensaje);
    log.textContent = `${topic} <- ${mensaje}`;
  }

  // ================= Init =================
  renderAccionadores();
  actualizarCamposFormulario();

  window.addEventListener('load', () => {
    if (hostInput.value && userInput.value && passInput.value) conectarMQTT();
  });
</script>
</body>
</html>
